<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamLogic</title>
    <link rel="icon" href="https://cdn.discordapp.com/attachments/1206645471976886352/1497258754616328333/IMG-20260423-WA0033.jpg?ex=69ecde60&is=69eb8ce0&hm=da87ac5c46e838744073912f4059500696920b76c8f3c5f24c9f4e7ff2774028" type="image/jpeg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        .stream-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 52px;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            border-bottom: 1px solid rgba(245,197,24,0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 40px rgba(245,197,24,0.08);
        }
        .stream-header::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(245,197,24,0.5), rgba(184,134,11,0.5), transparent);
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-logo {
            width: 34px; height: 34px;
            border-radius: 10px; object-fit: cover;
            border: 2px solid rgba(245,197,24,0.4);
            box-shadow: 0 0 12px rgba(245,197,24,0.2);
            transition: all 0.3s ease;
        }
        .header-logo:hover {
            border-color: rgba(245,197,24,0.8);
            box-shadow: 0 0 20px rgba(245,197,24,0.4);
            transform: scale(1.05);
        }
        .header-title {
            font-size: 20px; font-weight: 700;
            background: linear-gradient(135deg, #fff5cc 0%, #f5c518 50%, #d4a017 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px; text-transform: uppercase;
        }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .btn-action {
            display: flex; align-items: center; gap: 8px;
            padding: 7px 16px;
            background: linear-gradient(135deg, rgba(245,197,24,0.15), rgba(184,134,11,0.2));
            border: 1px solid rgba(245,197,24,0.35);
            border-radius: 10px;
            color: #fce883;
            font-family: 'Inter', sans-serif;
            font-size: 13px; font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            user-select: none;
        }
        .btn-action:hover {
            background: linear-gradient(135deg, rgba(245,197,24,0.3), rgba(184,134,11,0.35));
            border-color: rgba(245,197,24,0.6);
            color: #fff8cc;
            box-shadow: 0 0 20px rgba(245,197,24,0.2);
            transform: translateY(-1px);
        }
        .btn-action:active { transform: translateY(0); }
        .btn-action svg { transition: transform 0.4s ease; }
        .btn-action:hover svg { transform: rotate(180deg); }
        .btn-action.spinning svg { animation: spin 0.7s linear infinite; }
        .btn-home {
            background: linear-gradient(135deg, rgba(184,134,11,0.15), rgba(245,197,24,0.1));
            border-color: rgba(245,197,24,0.25);
        }
        .btn-home:hover {
            background: linear-gradient(135deg, rgba(184,134,11,0.3), rgba(245,197,24,0.2));
        }
        @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

        #iframeContainer {
            position: fixed;
            top: 52px; left: 0; right: 0; bottom: 0;
            overflow: hidden;
            background: #0d0d17;
        }
        #iframeContainer iframe {
            width: 100%; height: 100%; border: none;
        }

        .loading-overlay {
            position: fixed;
            top: 52px; left: 0; right: 0; bottom: 0;
            background: #0d0d17;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 9999;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }
        .loading-overlay.hidden {
            opacity: 0; visibility: hidden; pointer-events: none;
        }
        .loading-ring {
            width: 44px; height: 44px;
            border: 3px solid rgba(245,197,24,0.12);
            border-top-color: rgba(245,197,24,0.75);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 18px;
        }
        .loading-text {
            color: rgba(245,230,150,0.65);
            font-size: 13px; font-weight: 500;
            letter-spacing: 1.5px; text-transform: uppercase;
        }

        .error-overlay {
            position: fixed;
            top: 52px; left: 0; right: 0; bottom: 0;
            background: #0d0d17;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 9998;
            opacity: 0; visibility: hidden; pointer-events: none;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .error-overlay.visible {
            opacity: 1; visibility: visible; pointer-events: auto;
        }
        .error-icon { font-size: 48px; margin-bottom: 16px; }
        .error-msg {
            color: rgba(245,230,150,0.7);
            font-size: 15px; margin-bottom: 20px;
        }

        .block-overlay {
            position: fixed;
            top: 52px; left: 0; right: 0; bottom: 0;
            background: #0d0d17;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 10001;
            opacity: 0; visibility: hidden; pointer-events: none;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .block-overlay.visible {
            opacity: 1; visibility: visible; pointer-events: auto;
        }
        .block-card {
            background: rgba(15,15,26,0.9);
            border: 1px solid rgba(245,197,24,0.3);
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 20px rgba(245,197,24,0.1);
        }
        .block-title {
            color: #fce883;
            font-size: 22px; font-weight: 700;
            margin-bottom: 12px;
        }
        .block-desc {
            color: rgba(245,230,150,0.8);
            font-size: 15px;
            max-width: 300px;
        }


        @media (max-width: 520px) {
            .stream-header { height: 46px; padding: 0 12px; }
            .header-logo { width: 28px; height: 28px; }
            .header-title { font-size: 16px; }
            .btn-action { padding: 5px 10px; font-size: 12px; }
            .btn-action .btn-label { display: none; }
            #iframeContainer { top: 46px; }
            .loading-overlay { top: 46px; }
            .error-overlay { top: 46px; }
        }
    </style>
</head>
<body>
    <header class="stream-header">
        <div class="header-left">
            <img class="header-logo"
                src="https://cdn.discordapp.com/attachments/1206645471976886352/1497258754616328333/IMG-20260423-WA0033.jpg?ex=69ecde60&is=69eb8ce0&hm=da87ac5c46e838744073912f4059500696920b76c8f3c5f24c9f4e7ff2774028"
                alt="StreamLogic" onerror="this.style.display='none'">
            <span class="header-title">StreamLogic</span>
        </div>
        <div class="header-right">
            <button class="btn-action btn-home" id="btnHome" title="Inicio">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span class="btn-label">Inicio</span>
            </button>
            <button class="btn-action" id="btnReload" title="Recargar">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                </svg>
                <span class="btn-label">Recargar</span>
            </button>
        </div>
    </header>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-ring"></div>
        <div class="loading-text">Conectando con la API | V1.0</div>
    </div>

    <div class="error-overlay" id="errorOverlay">
        <div class="error-icon">⚠️</div>
        <div class="error-msg">No se pudo cargar el contenido | Código de error: 404</div>
        <button class="btn-action" id="btnRetry">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"></polyline>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
            <span>Reintentar</span>
        </button>
    </div>

    <div class="block-overlay" id="blockOverlay">
        <div class="block-card">
            <div class="error-icon">🚫</div>
            <div class="block-title">Acceso Restringido</div>
            <div class="block-desc">Este contenido no está disponible en tu región | Dale las gracias a @Zioles_Gay.</div>
        </div>
    </div>

    <div id="iframeContainer"></div>

    <script>
    (function() {
        var JKBASE = 'https://jkanime.net';
        var JKURL  = JKBASE + '/';
        var PROXIES = [
            function(u){ return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u); },
            function(u){ return 'https://corsproxy.io/?' + encodeURIComponent(u); },
            function(u){ return 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u); }
        ];

        var container  = document.getElementById('iframeContainer');
        var loading    = document.getElementById('loadingOverlay');
        var errorDiv   = document.getElementById('errorOverlay');
        var btnReload  = document.getElementById('btnReload');
        var btnHome    = document.getElementById('btnHome');
        var btnRetry   = document.getElementById('btnRetry');
        var currentUrl = JKURL;
        var bestProxy  = 0;

        function showLoad() { loading.classList.remove('hidden'); errorDiv.classList.remove('visible'); }
        function hideLoad() { loading.classList.add('hidden'); }
        function showError(){ loading.classList.add('hidden'); errorDiv.classList.add('visible'); }

        
        var INJECT_CSS = [
            'header,.navbar,nav.navbar,.top-bar,#header,.site-header,.main-header,.navigation,.nav-main{display:none!important}',
            '.app-banner,.app-download,.app-promo,.download-app,.box_app,.box-app,[class*="app-banner"],[class*="app-download"],#app-banner{display:none!important}',
            '.mobile-bottom-nav__item[href*="comunidad"],a[href*="comunidad"],.fullmenu.mobile-bottom-nav__item,.mobile-bottom-nav__item--mas{display:none!important}',
            'li:has(>a[href*="comunidad"]){display:none!important}',
            '#disqus_thread,.comments,#comments,.box-comments,.comentarios,[id*="comment"],[class*="comment"],#box_comments{display:none!important}',
            '.scrollup,#scrollUp,.back-to-top,.gotop,#go-top,.boton-subir,a[href="#top"],.btn-gotop,.btn-scroll-top,.scrollToTop,[onclick*="window.scrollTo"]{display:none!important}',
            'body{padding-top:0!important;margin-top:0!important}',
            '.content-wrapper,.main-content,#content{margin-top:0!important;padding-top:0!important}'
        ].join('\n');

        
        function buildInjectJS() {
            var blockJS = '';
            return '(function(){\n' +
            'var _origFetch=window.fetch;\n' +
            'window.fetch=function(url,opts){\n' +
            '  if(typeof url==="string"){\n' +
            '    if(' + adblockEnabled + ' && (url.indexOf("ads")!==-1 || url.indexOf("tracker")!==-1 || url.indexOf("analytics")!==-1)) return Promise.reject("AdBlocked");\n' +
            '    try{\n' +
            '      var r=new URL(url,"' + JKBASE + '/");\n' +
            '      if(r.hostname.indexOf("jkanime")!==-1){\n' +
            '        url="https://api.allorigins.win/raw?url="+encodeURIComponent(r.href);\n' +
            '      }\n' +
            '    }catch(e){}\n' +
            '  }\n' +
            '  return _origFetch.call(this,url,opts);\n' +
            '};\n' +
            
            'var _origOpen=XMLHttpRequest.prototype.open;\n' +
            'XMLHttpRequest.prototype.open=function(m,url){\n' +
            '  if(typeof url==="string"){\n' +
            '    if(' + adblockEnabled + ' && (url.indexOf("ads")!==-1 || url.indexOf("tracker")!==-1 || url.indexOf("analytics")!==-1)) return;\n' +
            '    try{\n' +
            '      var r=new URL(url,"' + JKBASE + '/");\n' +
            '      if(r.hostname.indexOf("jkanime")!==-1){\n' +
            '        arguments[1]="https://api.allorigins.win/raw?url="+encodeURIComponent(r.href);\n' +
            '      }\n' +
            '    }catch(e){}\n' +
            '  }\n' +
            '  return _origOpen.apply(this,arguments);\n' +
            '};\n' +
            
            'window.open = function() { console.log("AdBlock: Popup blocked"); return null; };\n' +
            
            'var blockObserver = new MutationObserver(function(mutations) {\n' +
            '  mutations.forEach(function(mutation) {\n' +
            '    mutation.addedNodes.forEach(function(node) {\n' +
            '      if (node.tagName === "SCRIPT" && node.src) {\n' +
            '        var src = node.src.toLowerCase();\n' +
            '        if (src.indexOf("ads") !== -1 || src.indexOf("pop") !== -1 || src.indexOf("track") !== -1 || src.indexOf("analytics") !== -1) {\n' +
            '          node.parentNode.removeChild(node);\n' +
            '          console.log("AdBlock: Script blocked -> " + src);\n' +
            '        }\n' +
            '      }\n' +
            '      if (node.tagName === "IFRAME" && node.src) {\n' +
            '        var src = node.src.toLowerCase();\n' +
            '        if (src.indexOf("ads") !== -1 || src.indexOf("banner") !== -1) {\n' +
            '          node.parentNode.removeChild(node);\n' +
            '          console.log("AdBlock: Iframe blocked -> " + src);\n' +
            '        }\n' +
            '      }\n' +
            '    });\n' +
            '  });\n' +
            '});\n' +
            'if(' + adblockEnabled + ') blockObserver.observe(document.documentElement, { childList: true, subtree: true });\n' +
            
            'document.cookie="darkmode=true;path=/;max-age=31536000";\n' +
            'document.documentElement.classList.add("dark-mode");\n' +
            'if(document.body) document.body.classList.add("dark-mode");\n' +
            'document.title="StreamLogic";\n' +

            
            'function cleanup(){\n' +
            '  document.querySelectorAll("header,.navbar,nav.navbar,.top-bar,.site-header,.main-header,#header,.navigation,.nav-main").forEach(function(e){e.style.display="none"});\n' +
            '  document.querySelectorAll("a").forEach(function(a){\n' +
            '    var t=a.textContent.trim().toLowerCase();\n' +
            '    if(t==="comunidad"||t==="más"||t==="mas"){(a.closest("li")||a.closest(".mobile-bottom-nav__item")||a).style.display="none"}\n' +
            '  });\n' +
            '  document.querySelectorAll("a[href*=\\"comunidad\\"]").forEach(function(a){(a.closest("li")||a).style.display="none"});\n' +
            '  document.querySelectorAll(".fullmenu.mobile-bottom-nav__item").forEach(function(e){e.style.display="none"});\n' +
            '  document.querySelectorAll("a[href*=\\"aplicacion\\"]").forEach(function(a){\n' +
            '    var p=a.parentElement;\n' +
            '    for(var i=0;i<5&&p&&p.tagName!=="BODY"&&p.tagName!=="MAIN";i++){\n' +
            '      if(p.textContent.indexOf("Descargar")!==-1||p.textContent.indexOf("aplicaci")!==-1){p.style.display="none";break}\n' +
            '      p=p.parentElement;\n' +
            '    }\n' +
            '  });\n' +
            '  document.querySelectorAll("h1,h2,h3,h4,div,span").forEach(function(e){\n' +
            '    var t=e.textContent.trim().toUpperCase();\n' +
            '    if(t==="COMENTARIOS"||t.indexOf("COMENTARIOS (")===0||t==="COMENTA EL ANIME"){\n' +
            '      var p=e.parentElement;\n' +
            '      if(p&&p.tagName!=="BODY"&&p.tagName!=="MAIN"){p.style.display="none"}\n' +
            '      e.style.display="none";\n' +
            '    }\n' +
            '  });\n' +
            '  document.querySelectorAll("a[href$=\\"#\\"], a[href=\\"#top\\"]").forEach(function(a){\n' +
            '    if(!a.textContent.trim() || a.href.indexOf("jkanime.net/#")!==-1) a.style.display="none";\n' +
            '  });\n' +
            '  var tgl=document.querySelector(".switchBtn input[type=\\"checkbox\\"]");\n' +
            '  if(tgl&&!tgl.checked) tgl.click();\n' +
            '  if(document.body){document.body.style.paddingTop="0";document.body.style.marginTop="0"}\n' +
            '}\n' +
            'cleanup();\n' +
            'setTimeout(cleanup,300);\n' +
            'setTimeout(cleanup,800);\n' +
            'setTimeout(cleanup,2000);\n' +
            'if(document.body){new MutationObserver(function(){cleanup()}).observe(document.body,{childList:true,subtree:true})}\n' +

            
            'document.addEventListener("click",function(e){\n' +
            '  var a=e.target.closest("a");\n' +
            '  if(!a)return;\n' +
            '  var href=a.getAttribute("href");\n' +
            '  if(!href||href.charAt(0)==="#"||href.indexOf("javascript:")===0)return;\n' +
            '  var resolved;\n' +
            '  try{resolved=new URL(href,"' + JKBASE + '/").href}catch(er){return}\n' +
            '  if(resolved.indexOf("jkanime.net")===-1)return;\n' +
            '  if(resolved.indexOf("#")!==-1 && resolved.split("#")[0].replace(/\\/$/,"") === "' + JKBASE + '") { e.preventDefault(); window.scrollTo(0,0); return; }\n' +
            '  e.preventDefault();e.stopPropagation();\n' +
            '  window.parent.postMessage({type:"sl-nav",url:resolved},"*");\n' +
            '},true);\n' +

            
            'document.addEventListener("submit",function(e){\n' +
            '  var form=e.target;\n' +
            '  var action=form.getAttribute("action")||"";\n' +
            '  var resolved;\n' +
            '  try{resolved=new URL(action,"' + JKBASE + '/").href}catch(er){return}\n' +
            '  if(resolved.indexOf("jkanime.net")===-1)return;\n' +
            '  e.preventDefault();\n' +
            '  var fd=new FormData(form);\n' +
            '  var params=new URLSearchParams(fd).toString();\n' +
            '  var navUrl=resolved+(resolved.indexOf("?")===-1?"?":"&")+params;\n' +
            '  window.parent.postMessage({type:"sl-nav",url:navUrl},"*");\n' +
            '},true);\n' +

            '})();\n';
        }

        
        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'sl-nav' && e.data.url) {
                currentUrl = e.data.url;
                loadPage(currentUrl);
            }
        });

        
        function loadPage(url) {
            currentUrl = url;
            showLoad();
            container.innerHTML = '';
            tryProxy(url, bestProxy);
        }

        function tryProxy(url, idx) {
            if (idx >= PROXIES.length) { showError(); return; }

            var proxyUrl = PROXIES[idx](url);
            var ctrl = new AbortController();
            var timer = setTimeout(function(){ ctrl.abort(); }, 10000);

            fetch(proxyUrl, { signal: ctrl.signal })
                .then(function(r) {
                    clearTimeout(timer);
                    if (!r.ok) throw new Error(r.status);
                    return r.text();
                })
                .then(function(html) {
                    if (!html || html.length < 200) throw new Error('empty');
                    bestProxy = idx;
                    renderPage(html, url);
                    hideLoad();
                })
                .catch(function() {
                    clearTimeout(timer);
                    tryProxy(url, idx + 1);
                });
        }

        
        function renderPage(html, pageUrl) {
            var baseTag = '<base href="' + JKBASE + '/" target="_self">';
            var earlyJS = '<script>' + buildInjectJS() + '<\/script>';
            
            var adblockCSS = '';
            if (adblockEnabled) {
                adblockCSS = 'iframe[src*="ads"], iframe[src*="adsystem"], iframe[src*="popunder"], iframe[src*="doubleclick"], div[id*="ad-"], div[class*="ad-"], .adsbygoogle, .ad-container, .ad-slot, .advertisement, .banner-ad, a[href*="bet"], a[href*="casino"] { display: none !important; pointer-events: none !important; opacity: 0 !important; width: 0 !important; height: 0 !important; position: absolute !important; }';
            }
            
            var customCSS = '<style id="sl-css">' + INJECT_CSS + '\n' + adblockCSS + '</style>';
            var darkInit = '<script>document.cookie="darkmode=true;path=/;max-age=31536000";document.documentElement.classList.add("dark-mode");<\/script>';
            var adGuardScript = '';
            if (adblockEnabled) {
                adGuardScript = '<script src="https://userscripts.adtidy.org/release/adguard-extra/1.0/adguard-extra.user.js"><\/script>';
            }

            var headRe = /<head[^>]*>/i;
            var headMatch = html.match(headRe);
            if (headMatch) {
                html = html.replace(headMatch[0], headMatch[0] + baseTag + darkInit + adGuardScript + earlyJS);
            } else {
                html = '<head>' + baseTag + darkInit + adGuardScript + earlyJS + '</head>' + html;
            }

            
            html = html.replace(/<\/head>/i, customCSS + '</head>');

            
            html = html.replace(/<title>[^<]*<\/title>/i, '<title>StreamLogic</title>');

            
            container.innerHTML = '';
            var iframe = document.createElement('iframe');
            iframe.id = 'jkFrame';
            iframe.setAttribute('sandbox', 'allow-same-origin allow-scripts allow-popups allow-forms');
            iframe.style.cssText = 'width:100%;height:100%;border:none';
            container.appendChild(iframe);

            var doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.open();
            doc.write(html);
            doc.close();
        }

        
        btnReload.addEventListener('click', function() {
            btnReload.classList.add('spinning');
            setTimeout(function(){ btnReload.classList.remove('spinning'); }, 700);
            loadPage(currentUrl);
        });

        btnHome.addEventListener('click', function() {
            loadPage(JKURL);
        });

        btnRetry.addEventListener('click', function() {
            loadPage(currentUrl);
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'F5' || (e.ctrlKey && e.key === 'r')) {
                e.preventDefault();
                btnReload.click();
            }
        });

        var adblockEnabled = false;

        fetch('https://get.geojs.io/v1/ip/country.json')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                console.log('IP Data:', data);
                var code = (data.country || '').toUpperCase();
                if (code === 'DO') {
                    document.getElementById('blockOverlay').classList.add('visible');
                    hideLoad();
                    return;
                }
                if (code === 'MX') {
                    adblockEnabled = true;
                    console.log('AdBlock Activado para México');
                }
                loadPage(JKURL);
            })
            .catch(function(err) {
                console.error('IP Check Error:', err);
                loadPage(JKURL);
            });

    })();
    </script>
</body>
</html>
