                    var box = media ? (media.closest('.sl-player-own, #video_box, .player_normal') || media.parentElement) : (innerDoc.querySelector('.sl-player-own') || innerDoc.getElementById('video_box') || innerDoc.querySelector('.player_normal'));
                    if (!box) return payload;
                    var video = box.querySelector('video');
                    var frame = box.querySelector('iframe.player_conte, iframe[src]');
                    if (video) payload.mediaSrc = resolvePlayerUrl(video.currentSrc || video.src || video.getAttribute('src'));
                    if (frame) payload.src = resolvePlayerUrl(frame.src || frame.getAttribute('src'));
                } catch (err) {}
                return payload;
            }

            function readCurrentPlayerNode() {
                if (!currentFrame) return null;
                try {
                    var innerDoc = currentFrame.contentDocument || currentFrame.contentWindow.document;
                    var media = innerDoc.querySelector('.sl-player-own video, .sl-player-own iframe, #video_box video, #video_box iframe, .player_normal video, .player_normal iframe, iframe.player_conte, video');
                    var box = media ? (media.closest('.sl-player-own, #video_box, .player_normal') || media.parentElement) : (innerDoc.querySelector('.sl-player-own') || innerDoc.getElementById('video_box') || innerDoc.querySelector('.player_normal'));
                    if (!box) return null;
                    return box.querySelector('video') || box.querySelector('iframe.player_conte, iframe[src]');
                } catch (err) {
                    return null;
                }
            }

            function ensureDetachedPlayer() {
                if (detachedPlayer) return detachedPlayer;
                detachedPlayer = document.createElement('div');
                detachedPlayer.className = 'sl-detached-player';
                document.body.appendChild(detachedPlayer);
                return detachedPlayer;
            }

            function closeDetachedPlayer() {
                setDetachedPlayer(false);
            }

            function setDetachedPlayer(active, payload) {
                if (!active) {
                    document.body.classList.remove('sl-player-shell');
                    if (detachedPlayer) {
                        detachedPlayer.classList.remove('visible');
                        detachedPlayer.textContent = '';
                    }
                    if (currentFrame && currentFrame.contentWindow) {
                        currentFrame.contentWindow.postMessage({ type: 'sl-fullscreen-state', active: false }, '*');
                    }
                    return;
                }

                payload = payload || {};
                var current = readCurrentPlayerPayload();
                var mediaSrc = resolvePlayerUrl(payload.mediaSrc || current.mediaSrc);
                var src = resolvePlayerUrl(payload.src || current.src);
                if (!mediaSrc && !src) return;

                lastDetachedPayload = { src: src, mediaSrc: mediaSrc };
                document.body.classList.add('sl-player-shell');

                var player = ensureDetachedPlayer();
                player.textContent = '';

                if (mediaSrc) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.autoplay = true;
                    video.playsInline = true;
                    video.preload = 'metadata';
                    video.src = mediaSrc;
                    player.appendChild(video);
                } else {
                    var iframe = document.createElement('iframe');
                    iframe.src = src;
                    iframe.setAttribute('sandbox', 'allow-same-origin allow-scripts allow-popups allow-popups-to-escape-sandbox allow-forms allow-presentation allow-downloads');
                    iframe.setAttribute('allow', 'fullscreen *; autoplay *; encrypted-media *; picture-in-picture *; screen-wake-lock *');
                    iframe.setAttribute('allowfullscreen', 'true');
                    iframe.setAttribute('webkitallowfullscreen', 'true');
                    iframe.setAttribute('mozallowfullscreen', 'true');
                    iframe.allowFullscreen = true;
                    iframe.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');
                    player.appendChild(iframe);
                }

                var close = document.createElement('button');
                close.type = 'button';
                close.className = 'sl-detached-close';
                close.setAttribute('aria-label', 'Salir de pantalla completa');
                close.setAttribute('title', 'Salir de pantalla completa');
                close.innerHTML = '<span></span>';
                close.addEventListener('click', closeDetachedPlayer);
                player.appendChild(close);
                player.classList.add('visible');
            }


            window.addEventListener('message', function (e) {
                if (e.data && e.data.type === 'sl-nav' && e.data.url) {
                    currentUrl = e.data.url;
                    loadPage(currentUrl);
                }
                if (e.data && e.data.type === 'sl-player-shell') {
                    setDetachedPlayer(!!e.data.active, e.data);
                }
            });

            function syncOuterFullscreenClass() {
                if (!currentFrame) return;
                var active = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
                try {
                    var innerDoc = currentFrame.contentDocument || currentFrame.contentWindow.document;
                    if (innerDoc && innerDoc.documentElement) {
                        innerDoc.documentElement.classList.toggle('sl-fullscreen-active', active);
                    }
                    if (currentFrame.contentWindow) {
                        currentFrame.contentWindow.postMessage({ type: 'sl-fullscreen-state', active: active }, '*');
                    }
                } catch (err) {}
            }

            document.addEventListener('fullscreenchange', syncOuterFullscreenClass, true);
            document.addEventListener('webkitfullscreenchange', syncOuterFullscreenClass, true);
            document.addEventListener('keydown', function (e) {
                if (e.key !== 'Escape' || !document.body.classList.contains('sl-player-shell')) return;
                closeDetachedPlayer();
            }, true);


            function loadPage(url) {
                currentUrl = url;
                setDetachedPlayer(false);
                showLoad();
                container.innerHTML = '';
                tryProxy(url, bestProxy);
            }

            function tryProxy(url, idx) {
                if (idx >= PROXIES.length) { showError(); return; }

                var proxyUrl = PROXIES[idx](url);
                var ctrl = new AbortController();
                var timer = setTimeout(function () { ctrl.abort(); }, 10000);

                fetch(proxyUrl, { signal: ctrl.signal })
                    .then(function (r) {
                        clearTimeout(timer);
                        if (!r.ok) throw new Error(r.status);
                        return r.text();
                    })
                    .then(function (html) {
                        if (!html || html.length < 200) throw new Error('empty');
                        bestProxy = idx;
                        renderPage(html, url);
                        hideLoad();
                    })
                    .catch(function () {
                        clearTimeout(timer);
                        tryProxy(url, idx + 1);
                    });
            }


            function renderPage(html, pageUrl) {
                if (isUserMexico) {
                    var adKw = ["pin-up","pinup","caliente","exoclick","adsterra","popads","popcash","propellerads","monetag","a-ads","onclick","1xbet","bet365","adcash","yllix","hilltopads","betano","codere","adskeeper","mgid","adbooth","cpmstar","revenuehits","ad-maven","infolinks","chitika","bidvertiser","juicyads","plugrush","betway","bovada","draftkings","fanduel","betfair","williamhill","unibet","bwin","888sport","betfred","betvictor","paddypower","skybet","ladbrokes","coral","betonline","sportsbetting","bodog","betus","mybookie","outbrain","taboola","adthor","bebi.com","runative","clickadu","trafficstars","adxad","adxxx","ero-advertising","twinred","richads","zeropark","tonic","popmyads","popunder","adform","smartadserver","casalemedia","rubiconproject","pubmatic","openx","appnexus","criteo"];
                    for (var i=0; i<adKw.length; i++) {
                        var kw = adKw[i];
                        var scriptRegex = new RegExp('<script[^>]*src=["\\\'][^"\\\']*?' + kw + '[^"\\\']*?["\\\'][^>]*>[\\\\s\\\\S]*?<\\\\/script>', 'gi');
                        html = html.replace(scriptRegex, '');
                        var iframeRegex = new RegExp('<iframe[^>]*src=["\\\'][^"\\\']*?' + kw + '[^"\\\']*?["\\\'][^>]*>[\\\\s\\\\S]*?<\\\\/iframe>', 'gi');
                        html = html.replace(iframeRegex, '');
                    }
                }

                var baseTag = '<base href="' + JKBASE + '/" target="_self">';
                var earlyJS = '<script>' + buildInjectJS(isUserMexico) + '<' + '/script>';
                var customCSS = '<style id="sl-css">' + BASE_CSS + (isUserMexico ? '\n' + ADBLOCK_CSS : '') + '</style>';
                var darkInit = '<script>document.cookie="darkmode=true;path=/;max-age=31536000";document.documentElement.classList.add("dark-mode");<' + '/script>';


                var headRe = /<head[^>]*>/i;
                var headMatch = html.match(headRe);
                if (headMatch) {
                    html = html.replace(headMatch[0], headMatch[0] + baseTag + darkInit + earlyJS);
                } else {
                    html = '<head>' + baseTag + darkInit + earlyJS + '</head>' + html;
                }


                html = html.replace(/<\/head>/i, customCSS + '</head>');


                html = html.replace(/<title>[^<]*<\/title>/i, '<title>StreamLogic</title>');


                container.innerHTML = '';
                var iframe = document.createElement('iframe');
                iframe.id = 'jkFrame';
                iframe.setAttribute('sandbox', 'allow-same-origin allow-scripts allow-popups allow-popups-to-escape-sandbox allow-forms allow-presentation allow-downloads allow-top-navigation-by-user-activation');
                iframe.setAttribute('allow', 'fullscreen *; autoplay *; encrypted-media *; picture-in-picture *; screen-wake-lock *');
                iframe.setAttribute('allowfullscreen', 'true');
                iframe.setAttribute('webkitallowfullscreen', 'true');
                iframe.setAttribute('mozallowfullscreen', 'true');
                iframe.allowFullscreen = true;
                iframe.style.cssText = 'width:100%;height:100%;border:none';
                currentFrame = iframe;
                container.appendChild(iframe);

                var doc = iframe.contentDocument || iframe.contentWindow.document;
                doc.open();
                doc.write(html);
                doc.close();
                setTimeout(syncOuterFullscreenClass, 0);
            }


            btnReload.addEventListener('click', function () {
                btnReload.classList.add('spinning');
                setTimeout(function () { btnReload.classList.remove('spinning'); }, 700);
                loadPage(currentUrl);
            });

            btnHome.addEventListener('click', function () {
                loadPage(JKURL);
            });

            btnDirectorio.addEventListener('click', function () {
                loadPage(JKURL + 'directorio/');
            });

            btnHorario.addEventListener('click', function () {
                loadPage(JKURL + 'horario/');
            });

            searchInput.addEventListener('focus', function () {
                var end = searchInput.value.length;
                searchInput.setSelectionRange(end, end);
            });

            searchInput.addEventListener('input', function (e) {
                if (e.isComposing || !e.inputType || e.inputType.indexOf('insert') !== 0) return;
                var end = searchInput.value.length;
                searchInput.setSelectionRange(end, end);
            });

            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    var query = searchInput.value.trim();
                    if (query) {
                        loadPage(JKURL + 'buscar/' + encodeURIComponent(query) + '/');
                    }
                }
            });

            btnRetry.addEventListener('click', function () {
                loadPage(currentUrl);
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'F5' || (e.ctrlKey && e.key === 'r')) {
                    e.preventDefault();
                    btnReload.click();
                }
            });

            function showPlusPopup() {
                var popup = document.getElementById('plusPopupOverlay');
                if (!popup) return;

                if (userIP && blockedIPs.indexOf(userIP) !== -1) {
                    popup.classList.remove('show');
                    return;
                }
                
                if (!popup.classList.contains('show')) {
                    popup.classList.add('show');
                }
            }

            showPlusPopup();

            function checkCountry() {
                var apis = [
                    { url: 'https://ipapi.co/json/', field: 'country_code' },
                    { url: 'https://api.country.is', field: 'country' },
                    { url: 'https://get.geojs.io/v1/ip/country.json', field: 'country' }
                ];
                
                var currentApiIdx = 0;
                
                function tryNextApi() {
                    if (currentApiIdx >= apis.length) {
                        document.getElementById('blockOverlay').classList.add('visible');
                        hideLoad();
                        return;
                    }
                    
                    var api = apis[currentApiIdx];
                    var ctrl = new AbortController();
                    var timeoutId = setTimeout(function() { ctrl.abort(); }, 3500);
                    
                    fetch(api.url, { signal: ctrl.signal })
                        .then(function (r) { return r.json(); })
                        .then(function (data) {
                            clearTimeout(timeoutId);
                            var code = (data[api.field] || '').toUpperCase();
                            userIP = (data.ip || data.query || "").toString().trim();
                            var isBlocked = false;
                            for (var i = 0; i < blockedIPs.length; i++) {
                                if (userIP === blockedIPs[i].trim()) {
                                    isBlocked = true;
                                    break;
                                }
                            }
                            console.log("=== SISTEMA PLUS ===");
                            console.log("IP Detectada por el servidor: " + userIP);
                            console.log("Es VIP/Plus?: " + isBlocked);
                            console.log("====================");

                            showPlusPopup();
                            
                            if (code === 'MX' || code === 'AR' || code === 'CL' || code === 'PE' || isBlocked) {
                                isUserMexico = isBlocked;
                                if (isBlocked) {
                                    document.body.classList.add('theme-plus');
                                }
                                loadPage(JKURL);
                            } else {
                                document.getElementById('blockOverlay').classList.add('visible');
                                hideLoad();
                            }
                        })
                        .catch(function (err) {
                            clearTimeout(timeoutId);
                            currentApiIdx++;
                            tryNextApi();
                        });
                }
                
                tryNextApi();
            }

            checkCountry();

            setInterval(showPlusPopup, 60000); 

            document.getElementById('closePlusPopup').addEventListener('click', function() {
                document.getElementById('plusPopupOverlay').classList.remove('show');
            });

        })();
    </script>
