<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamLogic</title>
    <link rel="icon" href="https://cdn.discordapp.com/attachments/1206645471976886352/1497258754616328333/IMG-20260423-WA0033.jpg?ex=69ecde60&is=69eb8ce0&hm=da87ac5c46e838744073912f4059500696920b76c8f3c5f24c9f4e7ff2774028" type="image/jpeg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* ═══════════════════════════════════════════ */
        /*  CUSTOM HEADER BAR                          */
        /* ═══════════════════════════════════════════ */
        .stream-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            border-bottom: 1px solid rgba(138, 43, 226, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 40px rgba(138, 43, 226, 0.08);
        }

        .stream-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(138, 43, 226, 0.5), rgba(75, 0, 130, 0.5), transparent);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            object-fit: cover;
            border: 2px solid rgba(138, 43, 226, 0.4);
            box-shadow: 0 0 12px rgba(138, 43, 226, 0.2);
            transition: all 0.3s ease;
        }

        .header-logo:hover {
            border-color: rgba(138, 43, 226, 0.8);
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.4);
            transform: scale(1.05);
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #e0e0ff 0%, #b388ff 50%, #7c4dff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-reload {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.15), rgba(75, 0, 130, 0.2));
            border: 1px solid rgba(138, 43, 226, 0.35);
            border-radius: 10px;
            color: #c9b0ff;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .btn-reload:hover {
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.3), rgba(75, 0, 130, 0.35));
            border-color: rgba(138, 43, 226, 0.6);
            color: #e0d0ff;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.2);
            transform: translateY(-1px);
        }

        .btn-reload:active {
            transform: translateY(0);
        }

        .btn-reload svg {
            transition: transform 0.5s ease;
        }

        .btn-reload:hover svg {
            transform: rotate(180deg);
        }

        .btn-reload.reloading svg {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ═══════════════════════════════════════════ */
        /*  IFRAME CONTAINER                           */
        /* ═══════════════════════════════════════════ */
        .iframe-container {
            position: fixed;
            top: 56px;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0a0f;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ═══════════════════════════════════════════ */
        /*  LOADING OVERLAY                            */
        /* ═══════════════════════════════════════════ */
        .loading-overlay {
            position: fixed;
            top: 56px;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(138, 43, 226, 0.15);
            border-top: 3px solid rgba(138, 43, 226, 0.8);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .loading-text {
            color: rgba(200, 180, 255, 0.7);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        /* ═══════════════════════════════════════════ */
        /*  ERROR OVERLAY                              */
        /* ═══════════════════════════════════════════ */
        .error-overlay {
            position: fixed;
            top: 56px;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0a0f;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9998;
            padding: 20px;
            text-align: center;
        }

        .error-overlay.visible {
            display: flex;
        }

        .error-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .error-title {
            color: #e0d0ff;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .error-desc {
            color: rgba(200, 180, 255, 0.6);
            font-size: 14px;
            max-width: 400px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .btn-retry {
            padding: 10px 28px;
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.2), rgba(75, 0, 130, 0.3));
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 10px;
            color: #c9b0ff;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-retry:hover {
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.35), rgba(75, 0, 130, 0.45));
            border-color: rgba(138, 43, 226, 0.7);
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.2);
        }

        /* ═══════════════════════════════════════════ */
        /*  RESPONSIVE                                 */
        /* ═══════════════════════════════════════════ */
        @media (max-width: 480px) {
            .stream-header {
                height: 48px;
                padding: 0 12px;
            }

            .header-logo {
                width: 30px;
                height: 30px;
            }

            .header-title {
                font-size: 16px;
            }

            .btn-reload {
                padding: 6px 12px;
                font-size: 12px;
            }

            .btn-reload span {
                display: none;
            }

            .iframe-container {
                top: 48px;
            }

            .loading-overlay {
                top: 48px;
            }

            .error-overlay {
                top: 48px;
            }
        }
    </style>
</head>
<body>
    <!-- ═══════════════ HEADER ═══════════════ -->
    <header class="stream-header" id="streamHeader">
        <div class="header-left">
            <img 
                class="header-logo" 
                src="https://cdn.discordapp.com/attachments/1206645471976886352/1497258754616328333/IMG-20260423-WA0033.jpg?ex=69ecde60&is=69eb8ce0&hm=da87ac5c46e838744073912f4059500696920b76c8f3c5f24c9f4e7ff2774028" 
                alt="StreamLogic Logo"
                onerror="this.style.display='none'"
            >
            <span class="header-title">StreamLogic</span>
        </div>
        <div class="header-right">
            <button class="btn-reload" id="btnReload" title="Recargar página">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                </svg>
                <span>Recargar</span>
            </button>
        </div>
    </header>

    <!-- ═══════════════ LOADING ═══════════════ -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Cargando StreamLogic<span class="loading-dots"></span></div>
    </div>

    <!-- ═══════════════ ERROR ═══════════════ -->
    <div class="error-overlay" id="errorOverlay">
        <div class="error-icon">⚠️</div>
        <div class="error-title">Error al cargar</div>
        <div class="error-desc">No se pudo cargar el contenido. Esto puede deberse a restricciones del servidor. Intenta recargar.</div>
        <button class="btn-retry" id="btnRetry">Reintentar</button>
    </div>

    <!-- ═══════════════ IFRAME CONTAINER ═══════════════ -->
    <div class="iframe-container" id="iframeContainer">
    </div>

    <script>
        (function() {
            const JKANIME_BASE = 'https://jkanime.net';
            const JKANIME_URL = JKANIME_BASE + '/';
            const PROXY_BASE = 'https://api.allorigins.win/raw?url=';
            const iframeContainer = document.getElementById('iframeContainer');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const errorOverlay = document.getElementById('errorOverlay');
            const btnReload = document.getElementById('btnReload');
            const btnRetry = document.getElementById('btnRetry');

            let currentUrl = JKANIME_URL;
            let navigationHistory = [JKANIME_URL];
            let historyIndex = 0;

            /* ═══════════════════════════════════════════ */
            /*  CSS TO INJECT INTO JKANIME                 */
            /* ═══════════════════════════════════════════ */
            const INJECT_CSS = `
                /* Hide the JKAnime blue header/nav bar */
                header,
                .navbar,
                .header,
                nav.navbar,
                .top-bar,
                #header,
                .site-header,
                .main-header,
                .navigation,
                .nav-main {
                    display: none !important;
                }

                /* Hide the "Aplicación oficial" banner */
                .app-banner,
                .app-download,
                .app-promo,
                .download-app,
                [class*="app-banner"],
                [class*="app-download"],
                [class*="aplicacion"],
                .box_app,
                .box-app,
                #app-banner {
                    display: none !important;
                }

                /* Hide Comunidad and Más sections in bottom nav and sidebar */
                .mobile-bottom-nav__item[href*="comunidad"],
                a[href*="comunidad"],
                .fullmenu.mobile-bottom-nav__item,
                .mobile-bottom-nav__item--mas {
                    display: none !important;
                }

                /* Hide Comunidad and Más from any navigation menu */
                li:has(> a[href*="comunidad"]) {
                    display: none !important;
                }

                /* Adjust body to remove header gap */
                body {
                    padding-top: 0 !important;
                    margin-top: 0 !important;
                }

                /* Fix any content offset that was accounting for the original header */
                .content-wrapper,
                .main-content,
                #content {
                    margin-top: 0 !important;
                    padding-top: 0 !important;
                }
            `;

            /* ═══════════════════════════════════════════ */
            /*  BUILD THE JS TO INJECT (with link intercept) */
            /* ═══════════════════════════════════════════ */
            function buildInjectJS() {
                return `
                (function() {
                    // Force dark mode
                    document.cookie = "darkmode=true; path=/; max-age=31536000";
                    document.documentElement.classList.add('dark-mode');
                    document.body.classList.add('dark-mode');
                    document.title = 'StreamLogic';

                    function hideElements() {
                        // Hide the header/nav bar
                        var headers = document.querySelectorAll('header, .navbar, nav.navbar, .top-bar, .site-header, .main-header, #header, .navigation, .nav-main');
                        headers.forEach(function(el) { el.style.display = 'none'; });

                        // Hide "Aplicación oficial" banner - match by content
                        var allElements = document.querySelectorAll('div, section, aside, article');
                        allElements.forEach(function(el) {
                            var text = el.textContent || '';
                            if ((text.indexOf('Hemos lanzado una aplicación') !== -1 || 
                                 text.indexOf('Aplicación oficial') !== -1 ||
                                 text.indexOf('aplicación móvil') !== -1) &&
                                el.querySelectorAll('a[href*="aplicacion"]').length > 0) {
                                el.style.display = 'none';
                            }
                        });

                        // Also hide by href to app download
                        var appLinks = document.querySelectorAll('a[href*="aplicacion"]');
                        appLinks.forEach(function(link) {
                            var container = link.closest('div[class]') || link.closest('section') || link.closest('.box_app') || link.parentElement;
                            if (container && container.textContent.indexOf('Descargar') !== -1) {
                                // Walk up to find the banner container
                                var parent = container;
                                for (var i = 0; i < 5; i++) {
                                    if (parent.parentElement && 
                                        parent.parentElement.tagName !== 'BODY' && 
                                        parent.parentElement.tagName !== 'MAIN' &&
                                        parent.parentElement.children.length <= 3) {
                                        parent = parent.parentElement;
                                    } else {
                                        break;
                                    }
                                }
                                parent.style.display = 'none';
                            }
                        });

                        // Hide Comunidad and Más links
                        var allLinks = document.querySelectorAll('a');
                        allLinks.forEach(function(link) {
                            var text = link.textContent.trim().toLowerCase();
                            if (text === 'comunidad' || text === 'más' || text === 'mas') {
                                var parent = link.closest('li') || link.closest('.mobile-bottom-nav__item') || link;
                                parent.style.display = 'none';
                            }
                        });

                        var comunidadLinks = document.querySelectorAll('a[href*="comunidad"]');
                        comunidadLinks.forEach(function(el) {
                            var p = el.closest('li') || el;
                            p.style.display = 'none';
                        });

                        var masItems = document.querySelectorAll('.fullmenu.mobile-bottom-nav__item');
                        masItems.forEach(function(el) { el.style.display = 'none'; });

                        document.body.style.paddingTop = '0';
                        document.body.style.marginTop = '0';

                        // Activate dark mode toggle if exists
                        var darkToggle = document.querySelector('.switchBtn input[type="checkbox"]');
                        if (darkToggle && !darkToggle.checked) {
                            darkToggle.click();
                        }
                    }

                    hideElements();
                    setTimeout(hideElements, 300);
                    setTimeout(hideElements, 800);
                    setTimeout(hideElements, 2000);
                    setTimeout(hideElements, 4000);

                    var observer = new MutationObserver(function() { hideElements(); });
                    if (document.body) {
                        observer.observe(document.body, { childList: true, subtree: true });
                    }

                    /* ═══════ INTERCEPT ALL LINK CLICKS ═══════ */
                    document.addEventListener('click', function(e) {
                        var link = e.target.closest('a');
                        if (!link) return;

                        var href = link.getAttribute('href');
                        if (!href) return;

                        // Resolve relative URLs
                        var resolvedUrl = '';
                        try {
                            resolvedUrl = new URL(href, document.baseURI || '${JKANIME_BASE}').href;
                        } catch(err) {
                            return; // Invalid URL, let it go
                        }

                        // Only intercept jkanime.net links
                        if (resolvedUrl.indexOf('jkanime.net') === -1 &&
                            resolvedUrl.indexOf('hentaijk.com') === -1) {
                            return; // External link, don't intercept
                        }

                        // Skip hash-only links and javascript: links
                        if (href.startsWith('#') || href.startsWith('javascript:')) return;

                        e.preventDefault();
                        e.stopPropagation();

                        // Send message to parent to navigate via proxy
                        window.parent.postMessage({
                            type: 'streamlogic-navigate',
                            url: resolvedUrl
                        }, '*');
                    }, true);

                    /* ═══════ INTERCEPT FORM SUBMISSIONS ═══════ */
                    document.addEventListener('submit', function(e) {
                        var form = e.target;
                        var action = form.getAttribute('action') || '';
                        var resolvedAction = '';
                        try {
                            resolvedAction = new URL(action, document.baseURI || '${JKANIME_BASE}').href;
                        } catch(err) {
                            return;
                        }

                        if (resolvedAction.indexOf('jkanime.net') !== -1) {
                            e.preventDefault();
                            // Build the URL with form data
                            var formData = new FormData(form);
                            var params = new URLSearchParams(formData).toString();
                            var navUrl = resolvedAction + (resolvedAction.indexOf('?') === -1 ? '?' : '&') + params;
                            window.parent.postMessage({
                                type: 'streamlogic-navigate',
                                url: navUrl
                            }, '*');
                        }
                    }, true);
                })();
                `;
            }

            /* ═══════════════════════════════════════════ */
            /*  LISTEN FOR NAVIGATION MESSAGES FROM IFRAME */
            /* ═══════════════════════════════════════════ */
            window.addEventListener('message', function(e) {
                if (e.data && e.data.type === 'streamlogic-navigate' && e.data.url) {
                    var targetUrl = e.data.url;
                    console.log('[StreamLogic] Navigating to:', targetUrl);
                    currentUrl = targetUrl;

                    // Add to history
                    navigationHistory = navigationHistory.slice(0, historyIndex + 1);
                    navigationHistory.push(targetUrl);
                    historyIndex = navigationHistory.length - 1;

                    loadViaProxy(targetUrl);
                }
            });

            /* ═══════════════════════════════════════════ */
            /*  LOAD CONTENT VIA PROXY (primary method)    */
            /* ═══════════════════════════════════════════ */
            function loadContent(url) {
                currentUrl = url;
                loadViaProxy(url);
            }

            function loadViaProxy(url) {
                iframeContainer.innerHTML = '';
                loadingOverlay.classList.remove('hidden');
                errorOverlay.classList.remove('visible');

                var proxyUrl = PROXY_BASE + encodeURIComponent(url);

                fetch(proxyUrl)
                    .then(function(response) {
                        if (!response.ok) throw new Error('Proxy error: ' + response.status);
                        return response.text();
                    })
                    .then(function(html) {
                        var modifiedHTML = modifyHTML(html, url);
                        renderInIframe(modifiedHTML);
                        loadingOverlay.classList.add('hidden');
                    })
                    .catch(function(err) {
                        console.error('[StreamLogic] Proxy failed:', err);
                        // Try direct iframe as fallback
                        loadViaDirectIframe(url);
                    });
            }

            function loadViaDirectIframe(url) {
                iframeContainer.innerHTML = '';

                var iframe = document.createElement('iframe');
                iframe.id = 'jkanimeFrame';
                iframe.setAttribute('referrerpolicy', 'no-referrer');
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                iframe.style.border = 'none';

                var loaded = false;

                iframe.onload = function() {
                    loaded = true;
                    loadingOverlay.classList.add('hidden');
                    try {
                        var iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                        var style = iframeDoc.createElement('style');
                        style.textContent = INJECT_CSS;
                        iframeDoc.head.appendChild(style);
                        var script = iframeDoc.createElement('script');
                        script.textContent = buildInjectJS();
                        iframeDoc.body.appendChild(script);
                        iframeDoc.title = 'StreamLogic';
                    } catch(e) {
                        console.warn('[StreamLogic] Cross-origin, modifications limited');
                    }
                };

                setTimeout(function() {
                    if (!loaded) {
                        loadingOverlay.classList.add('hidden');
                        errorOverlay.classList.add('visible');
                    }
                }, 15000);

                iframe.src = url;
                iframeContainer.appendChild(iframe);
            }

            function renderInIframe(html) {
                iframeContainer.innerHTML = '';

                var iframe = document.createElement('iframe');
                iframe.id = 'jkanimeFrame';
                iframe.setAttribute('sandbox', 'allow-same-origin allow-scripts allow-popups allow-forms');
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                iframe.style.border = 'none';

                iframeContainer.appendChild(iframe);

                var iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                iframeDoc.open();
                iframeDoc.write(html);
                iframeDoc.close();
            }

            /* ═══════════════════════════════════════════ */
            /*  MODIFY HTML BEFORE RENDERING               */
            /* ═══════════════════════════════════════════ */
            function resolveBaseUrl(url) {
                // Get the base for relative URLs
                var idx = url.lastIndexOf('/');
                if (idx > 8) return url.substring(0, idx + 1);
                return url.endsWith('/') ? url : url + '/';
            }

            function modifyHTML(html, pageUrl) {
                var baseUrl = JKANIME_BASE + '/';

                // Add base tag for relative URLs
                var baseTag = '<base href="' + baseUrl + '" target="_self">';

                // Dark mode cookie (runs immediately)
                var darkModeScript = '<script>document.cookie="darkmode=true;path=/;max-age=31536000";document.documentElement.classList.add("dark-mode");<\/script>';

                // Our custom CSS injection  
                var customCSS = '<style id="streamlogic-inject">' + INJECT_CSS + '</style>';

                // Our custom JS injection (with link interception!)
                var customJS = '<script id="streamlogic-script">' + buildInjectJS() + '<\/script>';

                // Insert base tag and dark mode script right after <head>
                var headPattern = /<head[^>]*>/i;
                var headMatch = html.match(headPattern);
                if (headMatch) {
                    html = html.replace(headMatch[0], headMatch[0] + baseTag + darkModeScript);
                } else {
                    html = '<head>' + baseTag + darkModeScript + '</head>' + html;
                }

                // Insert custom CSS before </head>
                html = html.replace(/<\/head>/i, customCSS + '</head>');

                // Insert custom JS before </body>
                if (/<\/body>/i.test(html)) {
                    html = html.replace(/<\/body>/i, customJS + '</body>');
                } else {
                    html += customJS;
                }

                // Change title
                html = html.replace(/<title>[^<]*<\/title>/i, '<title>StreamLogic</title>');

                return html;
            }

            /* ═══════════════════════════════════════════ */
            /*  RELOAD                                     */
            /* ═══════════════════════════════════════════ */
            function reloadContent() {
                btnReload.classList.add('reloading');
                setTimeout(function() {
                    btnReload.classList.remove('reloading');
                }, 800);
                loadViaProxy(currentUrl);
            }

            /* ═══════════════════════════════════════════ */
            /*  EVENT LISTENERS                            */
            /* ═══════════════════════════════════════════ */
            btnReload.addEventListener('click', reloadContent);
            btnRetry.addEventListener('click', function() {
                loadContent(currentUrl || JKANIME_URL);
            });

            // Keyboard shortcut: F5 or Ctrl+R to reload iframe instead of page
            document.addEventListener('keydown', function(e) {
                if (e.key === 'F5' || (e.ctrlKey && e.key === 'r')) {
                    e.preventDefault();
                    reloadContent();
                }
            });

            /* ═══════════════════════════════════════════ */
            /*  INITIAL LOAD                               */
            /* ═══════════════════════════════════════════ */
            loadContent(JKANIME_URL);

        })();
    </script>
