<html lang="es">

            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            overflow: hidden;
            height: 100vh;
            width: 100%;
        }

        .stream-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 52px;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            border-bottom: 1px solid rgba(245, 197, 24, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 40px rgba(245, 197, 24, 0.08);
        }

        .stream-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(245, 197, 24, 0.5), rgba(184, 134, 11, 0.5), transparent);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            object-fit: cover;
            border: 2px solid rgba(245, 197, 24, 0.4);
            box-shadow: 0 0 12px rgba(245, 197, 24, 0.2);
            transition: all 0.3s ease;
        }

        .header-logo:hover {
            border-color: rgba(245, 197, 24, 0.8);
            box-shadow: 0 0 20px rgba(245, 197, 24, 0.4);
            transform: scale(1.05);
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff5cc 0%, #f5c518 50%, #d4a017 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-action {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 16px;
            background: linear-gradient(135deg, rgba(245, 197, 24, 0.15), rgba(184, 134, 11, 0.2));
            border: 1px solid rgba(245, 197, 24, 0.35);
            border-radius: 10px;
            color: #fce883;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            user-select: none;
        }

        .btn-action:hover {
            background: linear-gradient(135deg, rgba(245, 197, 24, 0.3), rgba(184, 134, 11, 0.35));
            border-color: rgba(245, 197, 24, 0.6);
            color: #fff8cc;
            box-shadow: 0 0 20px rgba(245, 197, 24, 0.2);
            transform: translateY(-1px);
        }

        .btn-action:active {
            transform: translateY(0);
        }

        .btn-action svg {
            transition: transform 0.4s ease;
        }

        .btn-action:hover svg {
            transform: rotate(180deg);
        }

        .btn-action.spinning svg {
            animation: spin 0.7s linear infinite;
        }

        .btn-home {
            background: linear-gradient(135deg, rgba(184, 134, 11, 0.15), rgba(245, 197, 24, 0.1));
            border-color: rgba(245, 197, 24, 0.25);
        }

        .btn-home:hover {
            background: linear-gradient(135deg, rgba(184, 134, 11, 0.3), rgba(245, 197, 24, 0.2));
        }

        @keyframes spin {
            from {
                transform: rotate(0deg)
            }

            to {
                transform: rotate(360deg)
            }
        }

        #iframeContainer {
            position: absolute;
            top: 52px;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background: #0d0d17;
            z-index: 1;
        }

        #iframeContainer iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            pointer-events: auto;
        }

        .loading-overlay {
            position: fixed;
            top: 52px;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0d0d17;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loading-ring {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(245, 197, 24, 0.12);
            border-top-color: rgba(245, 197, 24, 0.75);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 18px;
        }

        .loading-text {
            color: rgba(245, 230, 150, 0.65);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .error-overlay {
            position: fixed;
            top: 52px;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0d0d17;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9998;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .error-overlay.visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .error-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .error-msg {
            color: rgba(245, 230, 150, 0.7);
            font-size: 15px;
            margin-bottom: 20px;
        }

        .block-overlay {
            position: fixed;
            top: 52px;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0d0d17;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10001;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .block-overlay.visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .block-card {
            background: rgba(15, 15, 26, 0.9);
            border: 1px solid rgba(245, 197, 24, 0.3);
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(245, 197, 24, 0.1);
        }

        .block-title {
            color: #fce883;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .block-desc {
            color: rgba(245, 230, 150, 0.8);
            font-size: 15px;
            max-width: 300px;
        }


        .header-center {
            flex: 1;
            max-width: 400px;
            margin: 0 20px;
            position: relative;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(245, 197, 24, 0.2);
            border-radius: 20px;
            padding: 6px 35px 6px 15px;
            color: #fff;
            font-size: 13px;
            direction: ltr;

            text-align: left;
            outline: none;
            transition: all 0.3s ease;

            }

                font-size: 12px;
            }

            .btn-action .btn-label {

            }

                top: 46px;
            }

            .loading-overlay {
                top: 46px;
            }

            .error-overlay {
                top: 46px;
            }
        }
    </style>
</head>

            window.addEventListener('message', function (e) {
                if (e.data && e.data.type === 'sl-nav' && e.data.url) {
                    currentUrl = e.data.url;
                    loadPage(currentUrl);
                }
            });


            function loadPage(url) {
                currentUrl = url;
                showLoad();
                container.innerHTML = '';
                tryProxy(url, bestProxy);
            }

            function tryProxy(url, idx) {
                if (idx >= PROXIES.length) { showError(); return; }

                var proxyUrl = PROXIES[idx](url);
                var ctrl = new AbortController();
                var timer = setTimeout(function () { ctrl.abort(); }, 10000);

                fetch(proxyUrl, { signal: ctrl.signal })
                    .then(function (r) {
                        clearTimeout(timer);
                        if (!r.ok) throw new Error(r.status);
                        return r.text();
                    })
                    .then(function (html) {
                        if (!html || html.length < 200) throw new Error('empty');
                        bestProxy = idx;
                        renderPage(html, url);
                        hideLoad();
                    })
                    .catch(function () {
                        clearTimeout(timer);
                        tryProxy(url, idx + 1);
                    });
            }


            function renderPage(html, pageUrl) {
                if (isUserMexico) {
                    var adKw = ["pin-up","pinup","caliente","exoclick","adsterra","popads","popcash","propellerads","monetag","a-ads","onclick","1xbet","bet365","adcash","yllix","hilltopads","betano","codere","adskeeper","mgid","adbooth","cpmstar","revenuehits","ad-maven","infolinks","chitika","bidvertiser","juicyads","plugrush","betway","bovada","draftkings","fanduel","betfair","williamhill","unibet","bwin","888sport","betfred","betvictor","paddypower","skybet","ladbrokes","coral","betonline","sportsbetting","bodog","betus","mybookie","outbrain","taboola","adthor","bebi.com","runative","clickadu","trafficstars","adxad","adxxx","ero-advertising","twinred","richads","zeropark","tonic","popmyads","popunder","adform","smartadserver","casalemedia","rubiconproject","pubmatic","openx","appnexus","criteo"];
                    for (var i=0; i<adKw.length; i++) {
                        var kw = adKw[i];
                        var scriptRegex = new RegExp('<script[^>]*src=["\\\'][^"\\\']*?' + kw + '[^"\\\']*?["\\\'][^>]*>[\\\\s\\\\S]*?<\\\\/script>', 'gi');
                        html = html.replace(scriptRegex, '');
                        var iframeRegex = new RegExp('<iframe[^>]*src=["\\\'][^"\\\']*?' + kw + '[^"\\\']*?["\\\'][^>]*>[\\\\s\\\\S]*?<\\\\/iframe>', 'gi');
                        html = html.replace(iframeRegex, '');
                    }
                }

                var baseTag = '<base href="' + JKBASE + '/" target="_self">';
                var earlyJS = '<script>' + buildInjectJS(isUserMexico) + '<' + '/script>';
                var customCSS = '<style id="sl-css">' + BASE_CSS + (isUserMexico ? '\n' + ADBLOCK_CSS : '') + '</style>';
                var darkInit = '<script>document.cookie="darkmode=true;path=/;max-age=31536000";document.documentElement.classList.add("dark-mode");<' + '/script>';


                var headRe = /<head[^>]*>/i;
                var headMatch = html.match(headRe);
                if (headMatch) {
                    html = html.replace(headMatch[0], headMatch[0] + baseTag + darkInit + earlyJS);
                } else {
                    html = '<head>' + baseTag + darkInit + earlyJS + '</head>' + html;
                }


                html = html.replace(/<\/head>/i, customCSS + '</head>');


                html = html.replace(/<title>[^<]*<\/title>/i, '<title>StreamLogic</title>');


                container.innerHTML = '';
                var iframe = document.createElement('iframe');
                iframe.id = 'jkFrame';
                iframe.setAttribute('sandbox', 'allow-same-origin allow-scripts allow-popups allow-forms allow-presentation allow-downloads allow-top-navigation-by-user-activation');
                iframe.style.cssText = 'width:100%;height:100%;border:none';
                container.appendChild(iframe);

                var doc = iframe.contentDocument || iframe.contentWindow.document;
                doc.open();
                doc.write(html);
                doc.close();
            }


            btnReload.addEventListener('click', function () {
                btnReload.classList.add('spinning');
                setTimeout(function () { btnReload.classList.remove('spinning'); }, 700);
                loadPage(currentUrl);
            });

            btnHome.addEventListener('click', function () {
                loadPage(JKURL);
            });

            btnDirectorio.addEventListener('click', function () {
                loadPage(JKURL + 'directorio/');
            });

            btnHorario.addEventListener('click', function () {
                loadPage(JKURL + 'horario/');
            });

            searchInput.addEventListener('focus', function () {
                var end = searchInput.value.length;
                searchInput.setSelectionRange(end, end);
            });

            searchInput.addEventListener('input', function (e) {
                if (e.isComposing || !e.inputType || e.inputType.indexOf('insert') !== 0) return;
                var end = searchInput.value.length;
                searchInput.setSelectionRange(end, end);
            });

            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    var query = searchInput.value.trim();
                    if (query) {
                        loadPage(JKURL + 'buscar/' + encodeURIComponent(query) + '/');
                    }
                }
            });

            btnRetry.addEventListener('click', function () {
                loadPage(currentUrl);
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'F5' || (e.ctrlKey && e.key === 'r')) {
                    e.preventDefault();
                    btnReload.click();
                }
            });

            function checkCountry() {
                var apis = [
                    { url: 'https://ipapi.co/json/', field: 'country_code' },
                    { url: 'https://api.country.is', field: 'country' },
                    { url: 'https://get.geojs.io/v1/ip/country.json', field: 'country' }
                ];
                
                var currentApiIdx = 0;
                
                function tryNextApi() {
                    if (currentApiIdx >= apis.length) {
                        document.getElementById('blockOverlay').classList.add('visible');
                        hideLoad();
                        return;
                    }
                    
                    var api = apis[currentApiIdx];
                    var ctrl = new AbortController();
                    var timeoutId = setTimeout(function() { ctrl.abort(); }, 3500);
                    
                    fetch(api.url, { signal: ctrl.signal })
                        .then(function (r) { return r.json(); })
                        .then(function (data) {
                            clearTimeout(timeoutId);
                            var code = (data[api.field] || '').toUpperCase();
                            if (code === 'MX' || code === 'AR' || code === 'CL' || code === 'PE') {
                                isUserMexico = (code === 'MX');
                                loadPage(JKURL);
                            } else {
                                document.getElementById('blockOverlay').classList.add('visible');
                                hideLoad();
                            }
                        })
                        .catch(function (err) {
                            clearTimeout(timeoutId);
                            currentApiIdx++;
                            tryNextApi();
                        });
                }
                
                tryNextApi();
            }

            checkCountry();

        })();
