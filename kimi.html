<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta Regresiva - 5 de Junio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --secondary: #ec4899;
            --accent: #06b6d4;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --border: rgba(255,255,255,0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: float 20s infinite ease-in-out;
            pointer-events: none;
        }

        .bg-orb:nth-child(1) {
            width: 400px;
            height: 400px;
            background: var(--primary);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .bg-orb:nth-child(2) {
            width: 300px;
            height: 300px;
            background: var(--secondary);
            bottom: -50px;
            right: -50px;
            animation-delay: -10s;
        }

        .bg-orb:nth-child(3) {
            width: 250px;
            height: 250px;
            background: var(--accent);
            top: 50%;
            left: 50%;
            animation-delay: -5s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 2rem;
            max-width: 1200px;
            width: 100%;
        }

        .header {
            margin-bottom: 3rem;
            animation: fadeInDown 1s ease-out;
        }

        .header h1 {
            font-size: clamp(1.8rem, 4vw, 3rem);
            font-weight: 800;
            background: linear-gradient(135deg, var(--text) 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 300;
        }

        .target-date {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1rem;
            padding: 0.5rem 1.2rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 100px;
            font-size: 0.9rem;
            color: var(--text-muted);
            backdrop-filter: blur(10px);
        }

        .target-date svg {
            width: 16px;
            height: 16px;
            color: var(--primary);
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1rem;
            margin: 2rem 0;
            animation: fadeInUp 1s ease-out 0.3s both;
        }

        .time-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem 1rem;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .time-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .time-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3), 0 0 20px var(--primary-glow);
        }

        .time-card:hover::before {
            opacity: 1;
        }

        .time-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            line-height: 1;
            display: block;
            background: linear-gradient(180deg, var(--text) 0%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: transform 0.2s ease;
        }

        .time-card.flipped .time-value {
            transform: scale(1.1);
            filter: brightness(1.3);
        }

        .time-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            margin-top: 0.75rem;
            font-weight: 600;
        }

        .separator {
            display: none;
        }

        .progress-section {
            margin-top: 3rem;
            animation: fadeInUp 1s ease-out 0.6s both;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--surface);
            border-radius: 100px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
            border-radius: 100px;
            transition: width 1s linear;
            position: relative;
            overflow: hidden;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .footer {
            margin-top: 3rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            opacity: 0.7;
            animation: fadeIn 2s ease-out 1s both;
        }

        .pulse-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 0.5rem;
            position: relative;
        }

        .pulse-dot::after {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 50%;
            border: 2px solid #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            .timer-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 0.75rem;
            }
            .time-card:nth-child(4), .time-card:nth-child(5) {
                grid-column: span 1;
            }
            .time-card {
                padding: 1rem 0.5rem;
            }
        }

        @media (max-width: 480px) {
            .timer-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .complete {
            display: none;
            animation: fadeIn 1s ease-out;
        }

        .complete.active {
            display: block;
        }

        .complete h2 {
            font-size: 3rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: confetti-fall 5s linear forwards;
            pointer-events: none;
            z-index: 1000;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>

    <div class="container">
        <div class="header">
            <h1>Cuenta Regresiva</h1>
            <p>Tiempo restante hasta el próximo objetivo</p>
            <div class="target-date">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
                <span>5 de Junio de 2026</span>
            </div>
        </div>

        <div class="timer-grid" id="timer">
            <div class="time-card" data-unit="days">
                <span class="time-value" id="days">00</span>
                <div class="time-label">Días</div>
            </div>
            <div class="time-card" data-unit="hours">
                <span class="time-value" id="hours">00</span>
                <div class="time-label">Horas</div>
            </div>
            <div class="time-card" data-unit="minutes">
                <span class="time-value" id="minutes">00</span>
                <div class="time-label">Minutos</div>
            </div>
            <div class="time-card" data-unit="seconds">
                <span class="time-value" id="seconds">00</span>
                <div class="time-label">Segundos</div>
            </div>
            <div class="time-card" data-unit="milliseconds">
                <span class="time-value" id="milliseconds">000</span>
                <div class="time-label">Milisegundos</div>
            </div>
        </div>

        <div class="complete" id="complete">
            <h2>¡Llegó el día!</h2>
            <p>El 5 de junio de 2026 ha llegado.</p>
        </div>

        <div class="progress-section" id="progressSection">
            <div class="progress-label">
                <span>Progreso del año</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
        </div>

        <div class="footer">
            <span class="pulse-dot"></span>
            Temporizador activo • Actualización en tiempo real
        </div>
    </div>

    <script>
        const targetDate = new Date('2026-06-05T00:00:00').getTime();
        const startOfYear = new Date('2026-01-01T00:00:00').getTime();
        const endOfYear = new Date('2027-01-01T00:00:00').getTime();

        const els = {
            days: document.getElementById('days'),
            hours: document.getElementById('hours'),
            minutes: document.getElementById('minutes'),
            seconds: document.getElementById('seconds'),
            milliseconds: document.getElementById('milliseconds'),
            timer: document.getElementById('timer'),
            complete: document.getElementById('complete'),
            progressFill: document.getElementById('progressFill'),
            progressPercent: document.getElementById('progressPercent'),
            progressSection: document.getElementById('progressSection')
        };

        let prevValues = {};

        function pad(num, size = 2) {
            return num.toString().padStart(size, '0');
        }

        function updateTimer() {
            const now = Date.now();
            const diff = targetDate - now;

            if (diff <= 0) {
                els.timer.style.display = 'none';
                els.progressSection.style.display = 'none';
                els.complete.classList.add('active');
                if (!window.celebrated) {
                    window.celebrated = true;
                    createConfetti();
                }
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            const milliseconds = Math.floor((diff % 1000));

            const values = {
                days: pad(days),
                hours: pad(hours),
                minutes: pad(minutes),
                seconds: pad(seconds),
                milliseconds: pad(milliseconds, 3)
            };

            Object.keys(values).forEach(key => {
                if (prevValues[key] !== values[key]) {
                    els[key].textContent = values[key];
                    const card = els[key].closest('.time-card');
                    card.classList.add('flipped');
                    setTimeout(() => card.classList.remove('flipped'), 200);
                }
            });

            prevValues = { ...values };

            const yearProgress = ((now - startOfYear) / (endOfYear - startOfYear)) * 100;
            const clampedProgress = Math.min(Math.max(yearProgress, 0), 100);
            els.progressFill.style.width = clampedProgress + '%';
            els.progressPercent.textContent = clampedProgress.toFixed(1) + '%';

            requestAnimationFrame(updateTimer);
        }

        function createConfetti() {
            const colors = ['#6366f1', '#ec4899', '#06b6d4', '#22c55e', '#f59e0b'];
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDuration = (3 + Math.random() * 4) + 's';
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 7000);
                }, i * 30);
            }
        }

        updateTimer();
    </script>
</body>
</html>
