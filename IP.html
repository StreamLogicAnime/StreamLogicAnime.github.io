<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu IP</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
body { min-height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle at 50% 0%, #1a1a2e 0%, #0f0f1a 100%); overflow: hidden; }
.particles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
.particle { position: absolute; background: rgba(0, 255, 204, 0.5); border-radius: 50%; animation: float linear infinite; }
@keyframes float { 0% { transform: translateY(100vh) scale(0); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(-10vh) scale(1); opacity: 0; } }
.card-container { position: relative; z-index: 2; animation: enter 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
@keyframes enter { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
.card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 24px; padding: 50px 40px; text-align: center; width: 400px; box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1); }
.icon-box { width: 80px; height: 80px; margin: 0 auto 30px; background: linear-gradient(135deg, #00ffcc, #0088ff); border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 10px 30px rgba(0,255,204,0.3); transition: transform 0.3s ease; }
.icon-box svg { width: 40px; height: 40px; fill: white; }
h1 { color: #fff; font-size: 1.1rem; font-weight: 300; letter-spacing: 3px; margin-bottom: 15px; }
.ip-display { color: #00ffcc; font-size: 2.8rem; font-weight: 700; margin-bottom: 40px; text-shadow: 0 0 20px rgba(0,255,204,0.4); min-height: 60px; display: flex; justify-content: center; align-items: center; }
.loader { width: 40px; height: 40px; border: 3px solid rgba(0, 255, 204, 0.2); border-top-color: #00ffcc; border-radius: 50%; animation: spin 1s linear infinite; display: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.btn { background: linear-gradient(135deg, #0088ff, #00ffcc); color: white; border: none; padding: 16px 30px; border-radius: 30px; font-size: 1.1rem; font-weight: 500; cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden; box-shadow: 0 10px 20px rgba(0,136,255,0.3); width: 100%; display: flex; justify-content: center; align-items: center; gap: 10px; }
.btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); transition: left 0.5s ease; }
.btn:hover { transform: scale(1.03); box-shadow: 0 15px 30px rgba(0,136,255,0.4); }
.btn:hover::before { left: 100%; }
.btn:active { transform: scale(0.98); }
.toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: rgba(0, 255, 204, 0.1); backdrop-filter: blur(10px); border: 1px solid #00ffcc; color: #00ffcc; padding: 12px 24px; border-radius: 20px; font-weight: 500; transition: bottom 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 10; box-shadow: 0 10px 30px rgba(0,255,204,0.2); }
.toast.show { bottom: 40px; }
</style>
</head>
<body>
<div class="particles" id="particles"></div>
<div class="card-container">
<div class="card" id="card">
<div class="icon-box">
<svg viewBox="0 0 24 24">
<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
</svg>
</div>
<h1>TU DIRECCIÓN IP</h1>
<div class="ip-display" id="ipDisplay">
<div class="loader" id="loader"></div>
</div>
<button class="btn" id="copyBtn">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
</svg>
Copiar IP
</button>
</div>
</div>
<div class="toast" id="toast">IP copiada al portapapeles</div>
<script>
const ipDisplay = document.getElementById('ipDisplay');
const loader = document.getElementById('loader');
const copyBtn = document.getElementById('copyBtn');
const toast = document.getElementById('toast');
const particles = document.getElementById('particles');
let currentIp = '';
for(let i=0; i<30; i++) {
const p = document.createElement('div');
p.className = 'particle';
p.style.width = Math.random() * 6 + 2 + 'px';
p.style.height = p.style.width;
p.style.left = Math.random() * 100 + 'vw';
p.style.animationDuration = Math.random() * 15 + 8 + 's';
p.style.animationDelay = Math.random() * 5 + 's';
particles.appendChild(p);
}
async function fetchIp() {
loader.style.display = 'block';
try {
const response = await fetch('https://api.ipify.org?format=json');
const data = await response.json();
currentIp = data.ip;
loader.style.display = 'none';
ipDisplay.textContent = currentIp;
} catch (error) {
loader.style.display = 'none';
ipDisplay.textContent = 'Error';
ipDisplay.style.color = '#ff4444';
}
}
copyBtn.addEventListener('click', () => {
if(currentIp) {
navigator.clipboard.writeText(currentIp).then(() => {
toast.classList.add('show');
setTimeout(() => toast.classList.remove('show'), 3000);
});
}
});
fetchIp();
</script>
</body>
</html>
